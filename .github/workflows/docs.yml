name: Documentation

on:
    push:
        branches:
            - main
        paths:
            - "docs/**"
            - "src/**"
            - "DESIGN.md"
            - "README.md"
            - ".github/workflows/docs.yml"
            - "pyproject.toml"
            - "uv.lock"

permissions: {}

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        name: Build documentation
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Install uv and Python
              uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
              with:
                  version: "0.11.28"
                  python-version: "3.14"
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --locked --all-groups --all-extras

            - name: Build documentation
              run: uv run sphinx-build -E -a -W --keep-going -b html docs/source docs/build/html

            - name: Upload artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: docs/build/html

    deploy:
        name: Deploy documentation
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        if: github.ref == 'refs/heads/main'
        permissions:
            pages: write # Required to deploy the Pages artifact.
            id-token: write # Required for Pages' OIDC deployment token.
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
